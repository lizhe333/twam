# Shared mount on the developer machine and Baidu A800 job.
# Per-GPU batch 64 in both stages; 3 x 64 x GA 1 = global batch 192.
task: insert_hole
mode: full

data_root: /zhe_li/tactile-wam/contact-belief-wam/data
manifest: /zhe_li/tactile-wam/contact-belief-wam/data/manifests/insert_hole.jsonl
stats: /zhe_li/tactile-wam/contact-belief-wam/data/stats/insert_hole.quantiles.json
tactile_cache: /zhe_li/tactile-wam/contact-belief-wam/data/cache/anytouch2
pi05_base: /zhe_li/tactile-wam/contact-belief-wam/models/pi05_base_local_debug
tokenizer_path: /zhe_li/tactile-wam/contact-belief-wam/models/tokenizer
world_init: /zhe_li/tactile-wam/contact-belief-wam/models/wave0_robotwin_world
output: /zhe_li/tactile-wam/contact-belief-wam/runs/insert_hole/full-k10-3xa800-bs192

python: python3.10
bootstrap_env: false
wheelhouse: /zhe_li/tactile-wam/contact-belief-wam/wheelhouse
device: cuda
num_gpus: 3
global_batch: 192
micro_batch: 64
precision: bf16
gradient_checkpointing: true
k: 10
data_mix: "1:1"

belief_warmup_min: 0
belief_warmup_max: 4
belief_bptt_steps: 2
belief_to_latent_queries: true
belief_to_world_state: true
belief_to_future_corrector: true
belief_to_contact_predictor: true
belief_to_expert: true

stage1_steps: auto
stage1_pretrained_steps: 2000
stage1_scratch_steps: 20000
stage2_steps: 10000
lr_new: 0.0001
lr_policy: 0.000025
grad_clip: 1.0
val_every: 500
val_batches: 8
save_every: 1000
workers: 2
seed: 42
resume: none
