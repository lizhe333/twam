# Head-only Original expert trajectories, with a newly trained contact Stage 1.
# Keep Recovery manifests, statistics and checkpoints in their old namespaces.
task: shared_wm
tasks: [insert_hole, insert_HDMI, insert_tube, pull_out_key, grasp_classify, lift_bottle, lift_can, put_bottle_in_shelf]
policy_tasks: [insert_hole, insert_HDMI, insert_tube, pull_out_key, grasp_classify, lift_bottle, lift_can, put_bottle_in_shelf]
expert_only: true
wm_validation_episode_ids: []
data_root: /zhe_li/tactile-wam/contact-belief-wam/data
original_root: /zhe_li/tactile-wam/UniVTAC/data/isaac45
recovery_root: /zhe_li/tactile-wam/contact-belief-wam/data/recovery
aligned_manifest_dir: /zhe_li/tactile-wam/contact-belief-wam/data/manifests/aligned_expert_only_all_train
shared_manifest: /zhe_li/tactile-wam/contact-belief-wam/data/manifests/aligned_expert_only_all_train/shared.jsonl
policy_manifest_dir: /zhe_li/tactile-wam/contact-belief-wam/data/manifests/aligned_expert_only_all_train/policy_all_train
task_stats_dir: /zhe_li/tactile-wam/contact-belief-wam/data/stats/aligned_expert_only_all_train/tasks
wm_stats: /zhe_li/tactile-wam/contact-belief-wam/data/stats/aligned_expert_only_all_train/wm_norm_stats.json
tactile_cache: /zhe_li/tactile-wam/contact-belief-wam/data/cache/anytouch2
pi05_base: /zhe_li/tactile-wam/contact-belief-wam/models/pi05_base_local_debug
tokenizer_path: /zhe_li/tactile-wam/models/pi05_base/big_vision/paligemma_tokenizer.model
world_init: /zhe_li/tactile-wam/outputs/wave0-shared-8task-mb32-002/shared_wm/stage1/checkpoints/step_00004500/pretrained_model
reference_wm_stats: /zhe_li/tactile-wam/outputs/wave0-shared-8task-mb32-002/shared_wm/stage1/checkpoints/step_00004500/wm_norm_stats.json
output: /zhe_li/tactile-wam/twam/runs/head-only-expert-only-8task-all-train-001
workspace: /zhe_li/tactile-wam
seed: 42
precision: bf16
gradient_checkpointing: true
attention_backend: sdpa
k: 10
camera_mode: head_only
stage1_freeze_world: true
policy_augmentation: true
fused_adamw: true
num_gpus: 8
workers: 4
micro_batch: 32
global_batch: 256
data_mix: '1:0'
ema_decay: 0.99
grad_clip: 1.0
log_every: 10
save_every: 1000
keep_checkpoints: 2
belief_warmup_min: 0
belief_warmup_max: 4
belief_bptt_steps: 2
stage2_freeze_belief: false
stage2_freeze_contact_predictor: true
independent_tactile: true
# All 800 Original trajectories train the new contact modules; no validation.
stage1:
  num_gpus: 8
  micro_batch: 32
  global_batch: 256
  steps: 5000
  lr: 0.0001
  warmup: 500
  final_lr: 0.0000025
  weight_decay: 0.01
  validate_every: 0
# Eight independent policies, each with its own 100 Original trajectories.
# At most two jobs run together, each using four GPUs and global batch 64.
stage2:
  num_gpus: 4
  micro_batch: 8
  global_batch: 64
  shard_optimizer_state: true
  ema_device: cuda
  steps: 10000
  lr: 0.000025
  lr_new: 0.0001
  lr_belief: 0.000025
  warmup: 1000
  final_lr: 0.0000025
  weight_decay: 0.0000000001
